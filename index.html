<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>العالــمي - الرئيسية</title>
<style>
body { background:#000; font-family:Arial; color:#0f0; direction:rtl; margin:0; padding:0; }
header { background:#000; padding:25px; text-align:center; border-bottom:2px solid #0f0; box-shadow:0 0 20px #0f0; }
header h1 { margin:0; font-size:38px; text-shadow:0 0 12px #0f0; }
.container { width:85%; max-width:900px; margin:40px auto; background:#070707; padding:25px; border:2px solid #0f0; border-radius:15px; box-shadow:0 0 25px #0f0; display:none; }
.article-box { background:#111; border:2px solid #0f0; padding:20px; border-radius:10px; min-height:200px; font-size:20px; line-height:1.8; }
.comments { margin-top:30px; background:#111; padding:15px; border-radius:10px; border:1px solid #0f0; }
.comment { padding:10px; margin-bottom:10px; border-bottom:1px dashed #0f0; }
.login-box { width:300px; margin:60px auto; background:#0a0a0a; padding:20px; border-radius:12px; border:2px solid #0f0; box-shadow:0 0 20px #0f0; text-align:center; }
input, textarea { width:90%; padding:10px; margin-top:10px; background:#000; border:1px solid #0f0; color:#0f0; border-radius:6px; }
button { margin-top:15px; padding:10px 20px; background:#000; border:1px solid #0f0; color:#0f0; cursor:pointer; border-radius:6px; }
button:hover { box-shadow: 0 0 15px #0f0; }
textarea { width:100%; height:80px; margin-top:15px; padding:10px; }
#errorMsg { color:red; margin-top:10px; display:none; }
#fileLink a { color:#0f0; text-decoration:underline; }
</style>
</head>
<body>

<!-- تسجيل الدخول -->
<div id="login" class="login-box">
  <h2>تسجيل الدخول / إنشاء حساب</h2>
  <input type="email" id="email" placeholder="البريد الإلكتروني">
  <input type="password" id="password" placeholder="كلمة المرور">
  <button onclick="emailLogin()">دخول عبر البريد</button>
  <button onclick="signUp()">إنشاء حساب جديد</button>
  <br><br>
  <button onclick="googleLogin()">تسجيل دخول Google</button>
  <p id="errorMsg"></p>
</div>

<!-- المحتوى -->
<div class="container" id="content">
<header>
  <h1>موقع العالــمي</h1>
</header>

<h2>📄 المقال الرئيسي</h2>
<div class="article-box">مرحبًا بك في موقع رفع الملفات… اكتب تعليقك!</div>

<h2 style="margin-top:35px;">💬 التعليقات</h2>
<div class="comments" id="comments"></div>
<textarea id="newComment" placeholder="اكتب تعليقك هنا..."></textarea>
<button onclick="addComment()">إضافة تعليق</button>

<h2 style="margin-top:35px;">📁 رفع الملفات</h2>
<input type="hidden" role="uploadcare-uploader" data-public-key="994dc8b431d0cb416e3" />
<div id="fileLink" style="margin-top:15px;"></div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

<!-- Uploadcare -->
<script src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js"></script>

<script>
// ===== Firebase Config =====
const firebaseConfig = {
  apiKey: "AIzaSyD8VShkW_oEKB1n1cAaPoyT9Qy3P8dREp8",
  authDomain: "elalmy-49226.firebaseapp.com",
  projectId: "elalmy-49226",
  storageBucket: "elalmy-49226.firebasestorage.app",
  messagingSenderId: "350934830042",
  appId: "1:350934830042:web:d2aeab648d4d42b08d4ee3",
  measurementId: "G-H11JSN719C"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const provider = new firebase.auth.GoogleAuthProvider();

// ===== حفظ الجلسة بشكل دائم =====
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

// ===== مراقبة حالة تسجيل الدخول =====
auth.onAuthStateChanged((user)=>{
  if(user){
    document.getElementById("login").style.display="none";
    document.getElementById("content").style.display="block";
    loadComments();
  } else {
    document.getElementById("login").style.display="block";
    document.getElementById("content").style.display="none";
  }
});

// ===== تسجيل دخول Google =====
function googleLogin(){
  auth.signInWithPopup(provider).catch(err=>showError(err.message));
}

// ===== تسجيل دخول البريد =====
function emailLogin(){
  auth.signInWithEmailAndPassword(
    document.getElementById('email').value,
    document.getElementById('password').value
  ).catch(err=>showError(err.message));
}

// ===== إنشاء حساب جديد =====
function signUp(){
  auth.createUserWithEmailAndPassword(
    document.getElementById('email').value,
    document.getElementById('password').value
  ).catch(err=>showError(err.message));
}

// ===== عرض الأخطاء =====
function showError(msg){
  let e=document.getElementById("errorMsg");
  e.style.display="block";
  e.innerText=msg;
}

// ===== إضافة تعليق =====
function addComment(){
  const text=document.getElementById("newComment").value.trim();
  if(text==="") return;

  const userName = auth.currentUser.email;

  db.collection("comments").add({
    user:userName,
    text:text,
    time:firebase.firestore.FieldValue.serverTimestamp()
  });

  document.getElementById("newComment").value="";
}

// ===== تحميل التعليقات =====
function loadComments(){
  const commentsDiv=document.getElementById("comments");
  commentsDiv.innerHTML="";

  db.collection("comments").orderBy("time").onSnapshot(snap=>{
    commentsDiv.innerHTML="";
    snap.forEach(doc=>{
      let d=doc.data();
      let div=document.createElement("div");
      div.className="comment";
      div.innerText = `${d.user}: ${d.text}`;
      commentsDiv.appendChild(div);
    });
  });
}

// ===== Uploadcare =====
UPLOADCARE_LOCALE="ar";
UPLOADCARE_TABS="file camera url";
UPLOADCARE_IMAGES_ONLY=false;

const widget=uploadcare.Widget('[role=uploadcare-uploader]');
widget.onUploadComplete(file=>{
  document.getElementById("fileLink").innerHTML =
    `<b>رابط الملف:</b><br><a href="${file.cdnUrl}" target="_blank">${file.cdnUrl}</a>`;
});
</script>

</body>
</html>
