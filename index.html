<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>العالــمي - الرئيسية</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js"></script>

<!-- Uploadcare -->
<script src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js"></script>

<style>
body { background:#000; color:#0f0; font-family:Arial; margin:0; padding:0; }
header { background:#000; padding:25px; text-align:center; border-bottom:2px solid #0f0; box-shadow:0 0 20px #0f0; }
header h1 { margin:0; font-size:38px; text-shadow:0 0 12px #0f0; }
.container { width:85%; max-width:900px; margin:40px auto; background:#070707; padding:25px; border:2px solid #0f0; border-radius:15px; box-shadow:0 0 25px #0f0; }
.article-box { background:#111; border:2px solid #0f0; padding:20px; border-radius:10px; min-height:200px; font-size:20px; line-height:1.8; }
.box { background:#111; padding:15px; margin:10px 0; border:1px solid #0f0; border-radius:10px; }
.commentUser { color:#0f0; font-weight:bold; font-size:17px; }
.like, .deleteBtn { cursor:pointer; color:#0f0; display:inline-block; margin-top:10px; margin-right:20px; font-size:16px; }
textarea { width:100%; height:80px; background:#000; color:#0f0; border:1px solid #0f0; border-radius:8px; padding:10px; }
input { width:95%; padding:10px; background:#000; color:#0f0; border:1px solid #0f0; border-radius:8px; }
button { background:#000; color:#0f0; border:1px solid #0f0; padding:10px 18px; margin-top:10px; cursor:pointer; border-radius:8px; }
</style>
</head>
<body>

<header>
  <h1>موقع العالــمي</h1>
</header>

<div class="container">
  <h2>📄 المقال الرئيسي</h2>
  <div class="article-box">
    موقع العاللمي لرفع الملفات يصنع لينك مباشر ل صوره او فديو او ملف او APK كل اللي انت محتاجه.
    مرحبًا بك… منتظر تعليقك!
  </div>

  <!-- تسجيل الدخول -->
  <h2 style="margin-top:35px;">🔥 تسجيل الدخول</h2>
  <div id="loginBox" class="box">
      <input id="userName" placeholder="اكتب اسمك" />
      <button onclick="loginUser()">تسجيل دخول</button>
  </div>

  <!-- كتابة التعليق -->
  <div id="commentBox" class="box" style="display:none;">
      <textarea id="commentText" placeholder="اكتب تعليقك..."></textarea>
      <button onclick="sendComment()">إرسال تعليق</button>
  </div>

  <!-- التعليقات -->
  <h2 style="margin-top:35px;">💬 التعليقات</h2>
  <div id="commentsContainer"></div>

  <h2 style="margin-top:35px;">📁 رفع الملفات</h2>
  <input type="hidden" role="uploadcare-uploader" data-public-key="994dc8b431d0cb416e3c" />
  <div id="fileLink" style="margin-top:15px;"></div>
</div>

<script>
// Firebase Config
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "SENDER_ID",
    appId: "APP_ID"
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentUser = null;

function loginUser(){
    let name = document.getElementById("userName").value;
    if(name.trim() === "") return alert("اكتب اسمك!");
    currentUser = name;
    localStorage.setItem("user", name);
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("commentBox").style.display = "block";
}

window.onload = () => {
    let saved = localStorage.getItem("user");
    if(saved){ currentUser = saved;
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("commentBox").style.display = "block";
    }
    loadComments();
};

function sendComment(){
    let text = document.getElementById("commentText").value;
    if(text.trim() === "") return;

    db.collection("comments").add({
        user: currentUser,
        text: text,
        likes: 0,
        time: Date.now()
    });

    document.getElementById("commentText").value = "";
}

function loadComments(){
    db.collection("comments").orderBy("time", "desc").onSnapshot(snapshot => {
        let container = document.getElementById("commentsContainer");
        container.innerHTML = "";

        snapshot.forEach(doc => {
            let data = doc.data();
            let isOwner = (data.user === currentUser);

            let div = document.createElement("div");
            div.className = "box";
            div.innerHTML = `
                <div class="commentUser">${data.user}</div>
                <div>${data.text}</div>
                <span class="like" onclick="likeComment('${doc.id}', ${data.likes})">👍 لايك (${data.likes})</span>
                ${isOwner ? `<span class="deleteBtn" onclick="deleteComment('${doc.id}')">🗑 حذف</span>` : ``}
            `;

            container.appendChild(div);
        });
    });
}

function likeComment(id, currentLikes){
    db.collection("comments").doc(id).update({ likes: currentLikes + 1 });
}

function deleteComment(id){
    if(confirm("هل تريد حذف هذا التعليق؟")){
        db.collection("comments").doc(id).delete();
    }
}

UPLOADCARE_LOCALE = "ar";
UPLOADCARE_TABS = "file camera url";
const widget = uploadcare.Widget('[role=uploadcare-uploader]');
widget.onUploadComplete(function(fileInfo){
    document.getElementById('fileLink').innerHTML = `
        <b>رابط الملف:</b><br>
        <a href="${fileInfo.cdnUrl}" target="_blank">${fileInfo.cdnUrl}</a>
    `;
});
</script>

</body>
</html>
